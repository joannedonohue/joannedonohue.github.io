<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi app navigation concept</title><desc id="desc">Raspberry Pi OS starts a full-screen launcher. Touch a tile, or rotate the keypad knob and press to select Focus, Trivia, or NoteNest. Each app has a Home action that returns to the launcher. Saving unfinished activity before leaving remains an implementation decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#eee" stroke-width="1.3"/></marker></defs>
<rect width="1080" height="850" fill="#050506"/>
<g fill="none" stroke="#e8e8e8" stroke-width="1.6" stroke-linejoin="round">
<rect x="365" y="35" width="350" height="76" rx="8"/><path d="M540 111V165" marker-end="url(#arrow)"/>
<rect x="255" y="166" width="570" height="285" rx="16"/><rect x="267" y="178" width="546" height="261" rx="9"/>
<path d="M280 240H800"/>
<rect x="292" y="273" width="144" height="116" rx="7" stroke-width="3"/><rect x="468" y="273" width="144" height="116" rx="7"/><rect x="644" y="273" width="144" height="116" rx="7"/>
<circle cx="279" cy="190" r="3"/><circle cx="801" cy="190" r="3"/>
<path d="M364 389V486H185V562M540 451V562M716 389V486H895V562" marker-end="url(#arrow)"/>
<rect x="55" y="564" width="260" height="175" rx="9"/><rect x="410" y="564" width="260" height="175" rx="9"/><rect x="765" y="564" width="260" height="175" rx="9"/>
<path d="M72 610H298M427 610H643M782 610H1008"/>
<path d="M185 739V782H33V214H251" stroke-dasharray="6 7" marker-end="url(#arrow)"/><path d="M540 739V782H185M895 739V782H540" stroke-dasharray="6 7"/>
</g>
<g fill="#f2f2f2" font-family="Arial,sans-serif" text-anchor="middle">
<text x="540" y="66" font-size="23">Raspberry Pi OS</text><text x="540" y="92" font-size="17" fill="#bbb">Start the full-screen launcher</text>
<text x="540" y="222" font-size="25">HOME / CHOOSE AN APP</text>
<text x="364" y="315" font-size="27">01</text><text x="364" y="354" font-size="23">Focus</text>
<text x="540" y="315" font-size="27">02</text><text x="540" y="354" font-size="23">Trivia</text>
<text x="716" y="315" font-size="27">03</text><text x="716" y="354" font-size="23">NoteNest</text>
<text x="540" y="418" font-size="17" fill="#bbb">Tap a tile · or turn the knob, then press</text>
<text x="185" y="594" font-size="23">FOCUS</text><text x="185" y="646" font-size="20">Start / pause a timer</text><text x="185" y="678" font-size="20">Switch focus and rest</text><text x="185" y="719" font-size="18">⌂ Home</text>
<text x="540" y="594" font-size="23">TRIVIA</text><text x="540" y="646" font-size="20">Choose A / B / C</text><text x="540" y="678" font-size="20">Reveal / next question</text><text x="540" y="719" font-size="18">⌂ Home</text>
<text x="895" y="594" font-size="23">NOTENEST</text><text x="895" y="646" font-size="20">Record / review a note</text><text x="895" y="678" font-size="20">Save to Obsidian</text><text x="895" y="719" font-size="18">⌂ Home</text>
<text x="540" y="526" font-size="17" fill="#bbb">Selection opens one app at a time</text>
<text x="540" y="820" font-size="19" fill="#ccc">Dashed path: Home returns to the launcher</text>
</g>
<g fill="#bbb" font-family="Arial,sans-serif" font-size="17"><text x="51" y="264">INPUT</text><text x="51" y="292">Touchscreen</text><text x="51" y="335">or keypad:</text><text x="51" y="364">Turn = browse</text><text x="51" y="393">Press = open</text></g>
</svg>
